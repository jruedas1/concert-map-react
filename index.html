<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds of San Anto</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="./css/main.css">
    <link rel="icon" type="x-icon" href="./img/favicon.ico">
</head>
<body>
    <div id="page-wrapper">
        <header class="mobile-hidden">
            <h1>The Sounds of San Anto</h1>
            <nav>
                <ul class="nav-menu mobile-hidden">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                </ul>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </nav>
        </header>
        <main>
            <section id="filters">
                <div id="search-type-selector" class="filter">
                    <h3 class="selected">SEARCH</h3>
                    <h3>EXPLORE</h3>
                </div>
                <div id="decades" class="filter">
                   <h3>SELECT A DECADE</h3>
                   <p class="edit hidden">Change Decade</p>
                </div>
                <div id="decade-list">
                    <div class="decade filter-option" data-id="1970">
                        <h3 data-id="1970">1970s</h3>
                     </div>
                     <div class="decade filter-option" data-id="1980">
                        <h3 data-id="1980">1980s</h3>
                     </div>
                     <div class="decade filter-option" data-id="1990">
                        <h3 data-id="1990">1990s</h3>
                     </div>
                     <div class="decade filter-option" data-id="2000">
                        <h3 data-id="2000">2000s</h3>
                     </div>
                </div>
                <div id="years" class="filter hidden">
                    <h3>SELECT A YEAR</h3>
                    <p class="edit hidden">Change Year</p>
                </div>
                <div id="year-list" class="hidden">
                </div>

                <div id="confirm-year-parent" class="confirm hidden">
                    <button id="confirm-year" class="next">
                        SHOW MY RESULTS
                    </button>
                </div>

                <div id="year-to-venue-breadcrumb" class="hidden">
                    <div id="back-to-year-edit-div">
                        <div>
                            <img src="./img/left-pointing-arrow.svg" alt="arrow pointing left">
                            <p class="edit">Change Selections</p>
                        </div>
                        <button id="list-view" class="hidden mobile-visible">List View</button>
                    </div>
                    <div id="year-venue-breadcrumb-flex-parent">
                         <h2 id="year-breadcrumb"></h2>
                         <p>Venues</p>
                    </div>
                </div>

                <div id="concert-to-venue-breadcrumb" class="hidden">
                    <div id="back-to-venues">
                       <img src="./img/left-pointing-arrow.svg" alt="arrow pointing left">
                       <p>Back to venues</p>
                    </div>
                    <div id="concert-to-venue-breadcrumb-flex-parent">
                        <h2></h2>
                        <p></p>
                    </div>
                </div>

                <div id="year-range" class="filter hidden">
                    <h3>SELECT A 5-YEAR RANGE</h3>
                    <p class="edit hidden">Edit</p>
                </div>
                <div id="year-slider-container" class="hidden">
                    <label for="year-slider" class="hidden">Year Range</label>
                    <input
                            type="range"
                            id="year-slider"
                            list="fiveYears"
                            min="1970"
                            max="2010"
                    >
                    <datalist id="fiveYears">
                        <option value="1970" label="1970"></option>
                        <option value="2010" label="2010"></option>
                    </datalist>
                    <div id="range-selection-state"></div>
                    <button id="confirm-range-selection" class="next">NEXT</button>
                </div>

                <div id="genres" class="filter hidden">
                    <h2>Genre</h2>
                    <img src="./img/arrow-down.svg" alt="Arrow icon pointing down">
                </div>
                <div id="genre-list" class="hidden">
                </div>

                <div id="venues" class="overflow-scroll"></div>
                <div id="concerts" class="overflow-scroll"></div>
            </section>
            <section id='map' class="mobile-hidden"></section>
        </main>
        <footer class="mobile-hidden">
            <div>
                <img src="./img/utsa-lib-logo-white.svg" alt="UTSA Libraries logo">
            </div>
            <div>
                <ul>
                    <li>email@email.com</li>
                    <li>210-458-0101</li>
                    <li>Footer Item</li>
                    <li>Footer Item</li>
                </ul>
            </div>
        </footer>
    </div>
    <script type="module" src="./src/index.js"></script>

</body>
</html>
