<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concert Companion</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="page-wrapper">
        <header>
            <h1>The Sounds of San Anto</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="filters">
                <div id="search-type-selector">
                    <h3 class="selected">SEARCH</h3>
                    <h3>EXPLORE</h3>
                </div>
                <div id="decades" class="filter">
                   <h3>SELECT A DECADE</h3>

                </div>
                <div id="decade-list" class="hidden">
                    <div class="decade filter-option">
                        <h3 data-id="1970">1970s</h3>
                    </div>
                     <div class="decade filter-option">
                        <h3 data-id="1980">1980s</h3>
                    </div>
                     <div class="decade filter-option">
                        <h3 data-id="1990">1990s</h3>
                    </div>
                     <div class="decade filter-option">
                        <h3 data-id="2000">2000s</h3>
                    </div>
                </div>
                <div id="years" class="filter">
                    <h3>SELECT A YEAR</h3>

                </div>
                <div id="year-list" class="hidden">
                </div>

                <div id="genres" class="filter" style="display: none">
                    <h2>Genre</h2>
                    <img src="./img/arrow-down.svg" alt="Arrow icon pointing down">
                </div>
                <div id="genre-list" class="hidden">
                </div>

                <div id="concerts"></div>
            </section>
            <section id='map'></section>
        </main>
        <footer>
            <div>
                <img src="./img/utsa-lib-logo-white.svg" alt="UTSA Libraries logo">
            </div>
            <div>
                <ul>
                    <li>email@email.com</li>
                    <li>210-458-0101</li>
                    <li>Footer Item</li>
                    <li>Footer Item</li>
                </ul>
            </div>
        </footer>
    </div>
    <script type="module" src="./src/index.js"></script>
</body>
</html>
