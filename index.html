<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concert Companion</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="page-wrapper">
        <header>
            <h1>The Sound of San Anto</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="filters">
                <div id="artists" class="filter">
                    <input type="text" id="artist-selector" placeholder="Artist or band">
                    <button>Search</button>
                </div>
                <div id="decades" class="filter">
                    <p id="selected-decade">1970s</p>
                    <label for="decade-selector">Select a decade:</label>
                    <input type="range" id="decade-selector" min="1970" max="2000" step="10" list="decade" value="1970">
                    <datalist id="decade">
                        <option value="1970" label="1970s"></option>
                        <option value="1980" label="1980s"></option>
                        <option value="1990" label="1990s"></option>
                        <option value="2000" label="2000s"></option>
                    </datalist>

                </div>
                <div id="years" class="filter">
                    <label for="year-selector">Select a year:</label>
                    <select name="year" id="year-selector">
                        <option value="1970">1970</option>
                        <option value="1971">1971</option>
                        <option value="1972">1972</option>
                        <option value="1973">1973</option>
                        <option value="1974">1974</option>
                        <option value="1975">1975</option>
                        <option value="1976">1976</option>
                        <option value="1977">1977</option>
                        <option value="1978">1978</option>
                        <option value="1979">1979</option>
                    </select>
                </div>

                <div id="genres" class="filter">
                    <label for="genre-selector">Select a genre:</label>
                    <input type="text" id="genre-selector" placeholder="metal, country, tejano ...">
                    <section id="genre-output"></section>
                </div>

               <div id="concerts"></div>
            </section>
            <section id='map'></section>
        </main>
    </div>
    <script src="./js/keys.js"></script>
    <script src="./js/mapbox-geocoder-utils.js"></script>
    <script>
        mapboxgl.accessToken = MAPBOX_API_KEY;
        const map = new mapboxgl.Map({
            container: 'map', // container ID
            style: 'mapbox://styles/mapbox/streets-v12', // style URL
            center: [-98.48725, 29.44879], // starting position [lng, lat]
            zoom: 11, // starting zoom
        });
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
