<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Concert Companion</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="filters">
        <label for="year-selector">Select a year:</label>
        <select name="year" id="year-selector">
            <option value="1970" selected="selected">1970</option>
            <option value="1971">1971</option>
            <option value="1972">1972</option>
            <option value="1973">1973</option>
            <option value="1974">1974</option>
            <option value="1975">1975</option>
            <option value="1976">1976</option>
            <option value="1977">1977</option>
            <option value="1978">1978</option>
            <option value="1979">1979</option>
        </select>
    </div>
    <div id='map' style='width: 400px; height: 300px;'></div>
    <div id="concerts"></div>
    <script src="./js/keys.js"></script>
    <script src="./js/mapbox-geocoder-utils.js"></script>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoianJ1ZWRhcyIsImEiOiJja29lZzZzaHAwYTNtMm5ucjAzajdleDkyIn0.yY13LnqWTQzsI8ESEwK-1A';
        const map = new mapboxgl.Map({
            container: 'map', // container ID
            style: 'mapbox://styles/mapbox/streets-v12', // style URL
            center: [-98.48725, 29.44879], // starting position [lng, lat]
            zoom: 11, // starting zoom
        });
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
